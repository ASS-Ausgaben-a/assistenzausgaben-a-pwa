<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1976d2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Assistenz">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <title>Assistenz</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#10223a;background:#f4f7fb}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%}body{min-height:100dvh}
    #start{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{width:min(92vw,460px);background:#fff;border-radius:24px;padding:28px;text-align:center;box-shadow:0 8px 30px #00000014}
    .card img{width:112px;height:112px;border-radius:24px}h1{margin:16px 0 8px;font-size:30px}p{margin:8px 0;color:#5b6778;line-height:1.5}
    .hint{font-size:15px;margin-top:18px}button{width:100%;margin-top:18px;border:0;border-radius:16px;padding:17px 18px;font-size:20px;font-weight:700;background:#1976d2;color:#fff;cursor:pointer}
    #error{display:none;margin-top:14px;padding:12px;border-radius:12px;background:#fdeaea;color:#9a1111;text-align:left}
    #frameWrap{display:none;width:100%;height:100dvh;background:#fff}iframe{display:block;width:100%;height:100%;border:0;background:#fff}
  </style>
</head>
<body>
  <section id="start"><div class="card">
    <img src="./icon-192.png" alt="Assistenz"><h1>Assistenz</h1><p>Ausgabenerfassung</p>
    <p class="hint">Diese Seite zum Home-Bildschirm hinzufuegen. Danach die App ueber das Symbol "Assistenz" starten.</p>
    <button id="openButton" type="button">App oeffnen</button><div id="error"></div>
  </div></section>
  <section id="frameWrap"><iframe id="webapp" title="Assistenzausgaben" allow="camera *; clipboard-read *; clipboard-write *"></iframe></section>
  <script>
    const start=document.getElementById('start'),frameWrap=document.getElementById('frameWrap'),frame=document.getElementById('webapp'),error=document.getElementById('error'),button=document.getElementById('openButton');
    let config=null;
    function isStandalone(){return window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true}
    function valid(v){try{const u=new URL(v);return u.protocol==='https:'&&u.hostname==='script.google.com'&&u.pathname.endsWith('/exec')}catch(_){return false}}
    async function load(){const r=await fetch('./config.json',{cache:'no-store'});if(!r.ok)throw new Error('Konfiguration konnte nicht geladen werden.');config=await r.json();if(!valid(String(config.webAppUrl||'').trim()))throw new Error('WebApp-Link ist ungueltig.');return config}
    async function openApp(){try{error.style.display='none';button.disabled=true;button.textContent='App wird geoeffnet ...';if(!config)await load();start.style.display='none';frameWrap.style.display='block';frame.src=String(config.webAppUrl).trim()}catch(e){button.disabled=false;button.textContent='App oeffnen';error.style.display='block';error.textContent=e&&e.message?e.message:'Die App konnte nicht gestartet werden.'}}
    button.addEventListener('click',openApp);
    if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
    if(isStandalone())openApp();else load().catch(e=>{error.style.display='block';error.textContent=e&&e.message?e.message:'Konfiguration konnte nicht geladen werden.'});
  </script>
</body></html>
